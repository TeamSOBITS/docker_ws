services:
  sobits-container:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      network: host
      args:
        LOCAL_UID:          ${LOCAL_UID}
        LOCAL_GID:          ${LOCAL_GID}
        UBUNTU_VERSION:     ${UBUNTU_VERSION}
        COMPUTE_TYPE:       ${COMPUTE_TYPE}
        USERNAME:           ${USERNAME}
        CONTAINER_NAME:     ${CONTAINER_NAME}
        CUDA_VERSION:       ${CUDA_VERSION}
        INSTALL_GAZEBO:     ${INSTALL_GAZEBO}
        PYTORCH_IMAGE_TAG:  ${PYTORCH_IMAGE_TAG}
        CV_IMAGE_TAG:       ${CV_IMAGE_TAG}
        ROS_IMAGE_TAG:      ${ROS_IMAGE_TAG}
        PYTORCH_VERSION:    ${PYTORCH_VERSION}
        CV2_VERSION:        ${CV2_VERSION}
        ROS_DISTRO:         ${ROS_DISTRO}
        ROS_DOMAIN_ID:      ${ROS_DOMAIN_ID}
        ROS_WORKSPACE:      ${ROS_WORKSPACE}
        PYTORCH_BASE_STAGE: ${PYTORCH_BASE_STAGE}
        OPENCV_BASE_STAGE:  ${OPENCV_BASE_STAGE}
        ROS_BASE_STAGE:     ${ROS_BASE_STAGE}
        FINAL_STAGE:        ${FINAL_STAGE}
    env_file: .env
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}
    privileged: true
    user: "${LOCAL_UID}:${LOCAL_GID}"
    network_mode: host
    ipc: host
    shm_size: "1g"
    stop_grace_period: 1s
    environment:
      - DISPLAY=${DISPLAY}
      - PULSE_SERVER=unix:/run/user/${LOCAL_UID}/pulse/native
    ulimits:
      rtprio: 98
      rttime: -1
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/snd
      - /dev/cpu_dma_latency
    volumes:
      - ${XDG_RUNTIME_DIR}/pulse:/run/user/${LOCAL_UID}/pulse
      - ../src:/home/${USERNAME}/${ROS_WORKSPACE}/src
      - /dev/bus/usb:/dev/bus/usb
      - /etc/udev/rules.d/:/etc/udev/rules.d/
      - /dev/serial/by-id/:/dev/serial/by-id/
      - /dev/v4l/by-id/:/dev/v4l/by-id/
    group_add:
      - adm
      - audio
      - sudo
      - video
      - dialout
    stdin_open: true
    tty: true

  # GPU configuration with device access
  sobits-container-gpu:
    build: 
      target: final
    extends:
      service: sobits-container
    environment:
      - NVIDIA_VISIBLE_DEVICES=all  
      - NVIDIA_DRIVER_CAPABILITIES=all
    group_add:
      - render
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
