services:
  sobits-container:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        LOCAL_UID: ${LOCAL_UID}
        LOCAL_GID: ${LOCAL_GID}
        USER_NAME: ${USER_NAME}
        UBUNTU_VERSION: ${UBUNTU_VERSION}
        INSTALL_ROS: ${INSTALL_ROS}
        ROS_DISTRO: ${ROS_DISTRO}
        COMPUTE_TYPE: ${COMPUTE_TYPE}
        CUDA_VERSION: ${CUDA_VERSION}
    env_file: .env
    image: ${USER_NAME}/${WORKSPACE_NAME}:${COMPUTE_TYPE}
    container_name: ${WORKSPACE_NAME}_${COMPUTE_TYPE}
    privileged: true
    user: "${LOCAL_UID}:${LOCAL_GID}"
    network_mode: host
    ipc: host
    shm_size: "1g"
    stop_grace_period: 1s
    environment:
      - DISPLAY=${DISPLAY}
      - PULSE_SERVER=unix:/run/user/${LOCAL_UID}/pulse/native
      - CONTAINER_NAME=${WORKSPACE_NAME}_${COMPUTE_TYPE}
    devices:
      - /dev/snd
    volumes:
      - ${XDG_RUNTIME_DIR}/pulse:/run/user/${LOCAL_UID}/pulse
      - ../src:/home/${USER_NAME}/colcon_ws/src
      - /etc/udev/rules.d/:/etc/udev/rules.d/
    stdin_open: true
    tty: true
    
  # # GPU configuration with device access
  sobits-container-gpu:
    extends:
      service: sobits-container
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
